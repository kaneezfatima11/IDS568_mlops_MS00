name: module3-milestone2-ci

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: module3/milestone2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: module3/milestone2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # We will add registry auth + push here next
      - name: Build Docker image (local)
        run: |
          docker build -t milestone2:${{ github.ref_name }} .
